name: Public remote OAuth probe
on:
  workflow_dispatch:
  push:
    branches: [fruwe/HEP-3370-remote-probe]
permissions:
  contents: read
concurrency:
  group: remote-oauth-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'TecDoctor/ios-oauth-association-repro'
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare private runtime configuration
        env:
          REMOTE_PROBE_JSON: ${{ secrets.REMOTE_PROBE_JSON }}
        run: python3 scripts/remote_transport.py prepare
      - name: Publish this runner's public address for temporary firewall restriction
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runner-address
          path: runner-ip.txt
          retention-days: 1
      - name: Wait for runner-specific access and start loopback TLS forwarding
        run: python3 scripts/remote_transport.py connect
      - name: Select toolchain and project generator
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          brew install xcodegen
      - name: Run generic OAuth callback reproduction
        env:
          REMOTE_PROBE_JSON: ${{ secrets.REMOTE_PROBE_JSON }}
        run: |
          python3 scripts/configure.py
          python3 scripts/run_probe.py
      - name: Upload encrypted screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-remote-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/diagnostics.enc
          if-no-files-found: ignore
          retention-days: 3
      - name: Remove only the owned simulator and private generated material
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, shutil
          owned = Path('.build/owned-simulator.txt')
          if owned.exists():
              udid = owned.read_text().strip()
              if re.fullmatch(r'[A-Fa-f0-9-]{36}', udid):
                  subprocess.run(['xcrun', 'simctl', 'shutdown', udid], capture_output=True, timeout=90)
                  subprocess.run(['xcrun', 'simctl', 'delete', udid], capture_output=True, timeout=90)
          for name in ('.generated', '.build', 'AssociationProbe.xcodeproj'):
              shutil.rmtree(name, ignore_errors=True)
          Path('.generated-project.json').unlink(missing_ok=True)
          PY
