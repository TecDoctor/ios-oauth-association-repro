name: Owner forwarding and certificate proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            slot: 2
          - runner: xcode-27
            slot: 3
          - runner: ubuntu-22.04
            slot: 4
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      SLOT: ${{ matrix.slot }}
    steps:
      - uses: actions/checkout@v6
      - name: Generate scoped owner-task checkout token
        id: owner-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.HEALTH_PORTAL_KEYCLOAK_REPO_ACCESS_APP_CLIENT_ID }}
          private-key: ${{ secrets.HEALTH_PORTAL_KEYCLOAK_REPO_ACCESS_APP_PRIVATE_KEY }}
          owner: TecDoctor
          repositories: health-portal-keycloak
          permission-contents: read
      - uses: actions/checkout@v6
        with:
          repository: TecDoctor/health-portal-keycloak
          ref: fruwe/HEP-3370
          token: ${{ steps.owner-token.outputs.token }}
          persist-credentials: false
          path: private-owner
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Makefile
            /scripts/
      - name: Install WireGuard
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew install wireguard-tools
          else
            sudo apt-get update -qq
            sudo apt-get install -y wireguard-tools
          fi
      - name: Prepare disposable keys
        env:
          PHASE: keys
          PROBE: ${{ secrets.REMOTE_PROBE_JSON }}
        run: python3 scripts/transport_probe.py
      - uses: actions/upload-artifact@v7
        with:
          name: transport-public-peer-${{ matrix.slot }}
          path: ${{ runner.temp }}/transport/public.json
          retention-days: 1
      - name: Activate tunnel
        shell: bash
        run: sudo -n "$(command -v wg-quick)" up "$RUNNER_TEMP/transport/probe.conf"
      - name: Execute transport checks once
        env:
          PHASE: test
        run: python3 scripts/transport_probe.py
      - name: Verify unchanged owner forwarding and certificate tasks
        run: python3 scripts/owner_task_probe.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: transport-results-${{ matrix.slot }}
          path: |
            ${{ runner.temp }}/transport/results.json
            ${{ runner.temp }}/transport/server-mtu.txt
            ${{ runner.temp }}/transport/server-links.txt
            ${{ runner.temp }}/transport/owner-results.json
            ${{ runner.temp }}/transport/safari-https.png
          retention-days: 1
      - name: Remove owned redirect
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/transport/redirect-installed" ]]; then
            make -s -C private-owner caddy.forward.remove
          fi
      - name: Remove tunnel
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/transport/probe.conf" ]]; then
            sudo -n "$(command -v wg-quick)" down "$RUNNER_TEMP/transport/probe.conf"
          fi
