name: Compose loaded-image policy proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image-policy:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Verify loaded image is reused despite service pull policy
        shell: bash
        run: |
          set -euo pipefail
          docker pull alpine:3
          docker tag alpine:3 local-only-policy-proof:run
          mkdir -p "$RUNNER_TEMP/compose-proof"
          cd "$RUNNER_TEMP/compose-proof"
          cat > compose.yml <<'COMPOSE'
          services:
            proof:
              image: local-only-policy-proof:run
              pull_policy: always
              command: ["sh", "-c", "echo loaded-image-policy-passed"]
          COMPOSE
          trap 'docker compose down' EXIT
          docker compose up --pull missing --abort-on-container-exit --exit-code-from proof
