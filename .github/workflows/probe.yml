name: Hosted process readiness proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  process:
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify delayed child readiness and bounded process-group cleanup once
        run: python3 scripts/probe_process_readiness.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: process-readiness
          path: results/process-readiness.json
          retention-days: 7
