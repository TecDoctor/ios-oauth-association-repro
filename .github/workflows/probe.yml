name: Owner-task access preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Check named read-only checkout configuration without exposing values
        env:
          APP_ID: ${{ vars.HEALTH_PORTAL_KEYCLOAK_REPO_ACCESS_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.HEALTH_PORTAL_KEYCLOAK_REPO_ACCESS_APP_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          present={name:bool(os.environ.get(name)) for name in ('APP_ID','APP_KEY')}
          print('Keycloak client ID available:',present['APP_ID'])
          print('Keycloak private key available:',present['APP_KEY'])
          raise SystemExit(0 if all(present.values()) else 1)
          PY
