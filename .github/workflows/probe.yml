name: Hosted SDK handoff observation
on:
  workflow_dispatch:
    inputs:
      target:
        description: Prepared environment for the single login/logout probe
        type: choice
        options: [sandbox, docker, android-health]
        default: sandbox
      sdk-ref:
        description: Optional diagnostic SDK branch (empty uses its latest default branch)
        type: string
        default: ''
      logout-observation:
        description: Isolate native status observation before the logout confirmation
        type: choice
        options: [confirmation-first, status-first]
        default: confirmation-first
      safari-foreground-probe:
        description: Experimental public Maestro runner that skips background Safari queries
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ inputs.target == 'android-health' && 'stock-android-health' || 'sdk-handoff-observation' }}
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'TecDoctor/ios-oauth-association-repro' && github.ref == 'refs/heads/fruwe/HEP-3370-wireguard-proof' && inputs.target != 'android-health'
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Create read-only SDK checkout token
        id: sdk-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.HEALTH_PORTAL_SDK_REPO_ACCESS_APP_CLIENT_ID || vars.HEALTH_PORTAL_SDK_REPO_ACCESS_APP_CLIENT_ID }}
          private-key: ${{ secrets.HEALTH_PORTAL_SDK_REPO_ACCESS_APP_PRIVATE_KEY }}
          owner: TecDoctor
          repositories: health-portal-sdk-ios
          permission-contents: read
      - name: Temporary private SDK checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: TecDoctor/health-portal-sdk-ios
          ref: ${{ inputs.sdk-ref }}
          path: sdk-private
          token: ${{ steps.sdk-token.outputs.token }}
          persist-credentials: false
      - name: Create read-only owner-task checkout token
        if: inputs.target == 'docker'
        id: owner-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.HEALTH_PORTAL_KEYCLOAK_REPO_ACCESS_APP_CLIENT_ID }}
          private-key: ${{ secrets.HEALTH_PORTAL_KEYCLOAK_REPO_ACCESS_APP_PRIVATE_KEY }}
          owner: TecDoctor
          repositories: health-portal-keycloak
          permission-contents: read
      - name: Temporary owner-task checkout
        if: inputs.target == 'docker'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: TecDoctor/health-portal-keycloak
          ref: fruwe/HEP-3370
          token: ${{ steps.owner-token.outputs.token }}
          persist-credentials: false
          path: private-owner
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Makefile
            /scripts/
      - name: Install client transport tools
        if: inputs.target == 'docker'
        run: brew install wireguard-tools
      - name: Prepare disposable client keys
        if: inputs.target == 'docker'
        env:
          REMOTE_PROBE_JSON: ${{ secrets.REMOTE_PROBE_JSON }}
        run: python3 scripts/remote_sdk_client.py keys
      - name: Publish public registration key only
        if: inputs.target == 'docker'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-client-public-peer
          path: ${{ runner.temp }}/sdk-transport/public.json
          if-no-files-found: error
          retention-days: 1
      - name: Download verified public Maestro
        run: |
          curl -fsSL https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.10.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          echo "29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro"
      - name: Build opt-in public Safari foreground probe
        if: inputs.safari-foreground-probe
        run: |
          git clone --filter=blob:none --depth 1 --branch cli-2.10.0 https://github.com/mobile-dev-inc/Maestro.git "$RUNNER_TEMP/public-driver-source/Maestro"
          test "$(git -C "$RUNNER_TEMP/public-driver-source/Maestro" rev-parse HEAD)" = 14a408335e17a090df1e26bdbeaf80d8122a8fd8
          python3 scripts/patch_public_maestro.py patch "$RUNNER_TEMP/public-driver-source/Maestro"
          (cd "$RUNNER_TEMP/public-driver-source/Maestro" && ARCHS=arm64 bash maestro-ios-xctest-runner/build-maestro-ios-runner.sh)
          python3 scripts/patch_public_maestro.py package "$RUNNER_TEMP/public-driver-source/Maestro" "$RUNNER_TEMP/maestro/maestro/lib/maestro-ios-driver.jar"
      - name: Verify one login and logout
        env:
          LOGOUT_OBSERVATION: ${{ inputs.logout-observation || 'confirmation-first' }}
          EXPECT_SDK_DIAGNOSTICS: ${{ inputs.sdk-ref == 'fruwe/HEP-3370-ui-diagnostics' && 'true' || 'false' }}
          PROBE_TARGET: ${{ inputs.target || 'sandbox' }}
          SANDBOX_CREDENTIALS_JSON: ${{ inputs.target != 'docker' && secrets.SANDBOX_CREDENTIALS_JSON || '' }}
          REMOTE_PROBE_JSON: ${{ inputs.target == 'docker' && secrets.REMOTE_PROBE_JSON || '' }}
        run: python3 scripts/probe_sdk_handoff.py
      - name: Upload encrypted evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-sdk-handoff
          path: .build/diagnostics.enc
          if-no-files-found: ignore
          retention-days: 3
      - name: Remove owned client transport
        if: always() && inputs.target == 'docker'
        run: python3 scripts/remote_sdk_client.py cleanup
      - name: Remove temporary private material
        if: always()
        run: rm -rf -- sdk-private private-owner .build "$RUNNER_TEMP/public-driver-source"

  android-health:
    if: github.repository == 'TecDoctor/ios-oauth-association-repro' && github.ref == 'refs/heads/fruwe/HEP-3370-wireguard-proof' && inputs.target == 'android-health'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Observe a disposable stock Android image
        run: bash scripts/android_health.sh
      - name: Upload stock OS diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stock-android-health
          path: results/android-health/
          if-no-files-found: ignore
          retention-days: 3
